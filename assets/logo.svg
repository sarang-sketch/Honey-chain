<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
  </defs>
  <!-- Geometric Honeycomb Chain Emblem -->
  <g transform="translate(6, 6)">
    <!-- Central Hexagon -->
    <polygon points="24,6 40,15 40,33 24,42 8,33 8,15" fill="url(#goldGrad)" opacity="0.95"/>
    <polygon points="24,11 35,17.5 35,30.5 24,37 13,30.5 13,17.5" fill="#FFFFFF" opacity="0.25"/>
    <!-- Interlocking chain nodes -->
    <circle cx="24" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="8" cy="15" r="3" fill="#1B4332"/>
    <circle cx="40" cy="15" r="3" fill="#1B4332"/>
    <circle cx="40" cy="33" r="3" fill="#1B4332"/>
    <circle cx="8" cy="33" r="3" fill="#1B4332"/>
    <!-- Little bee wings abstraction -->
    <path d="M19,17 C16,12 21,9 23,14 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M29,17 C32,12 27,9 25,14 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <!-- Brand Wordmark -->
  <text x="58" y="32" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="21" font-weight="800" fill="#1B4332" letter-spacing="-0.5">Honey<tspan fill="#D97706">Chain</tspan></text>
  <text x="59" y="45" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="8.5" font-weight="600" fill="#52525B" letter-spacing="1.2">SMART IOT &amp; TRACEABILITY</text>
</svg>